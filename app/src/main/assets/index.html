<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tadavi’s TV OS</title><style>
*{box-sizing:border-box;margin:0}
body{background:#070a14;color:#f1f5f9;font-family:system-ui,"Segoe UI",Roboto,sans-serif;overflow:hidden;height:100vh}
.orb{position:fixed;border-radius:50%;filter:blur(110px);opacity:.45;z-index:-1;animation:fl 14s ease-in-out infinite alternate}
.o1{width:520px;height:520px;background:#f97316;top:-160px;right:-80px}.o2{width:460px;height:460px;background:#6366f1;bottom:-160px;left:-100px;animation-delay:-6s}.o3{width:300px;height:300px;background:#ec4899;top:40%;left:45%;opacity:.2}
@keyframes fl{to{transform:translate(50px,40px) scale(1.15)}}
#boot{position:fixed;inset:0;background:#070a14;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .7s}
.mark{width:92px;height:92px;border-radius:28px;background:linear-gradient(135deg,#f97316,#ec4899,#6366f1);display:flex;align-items:center;justify-content:center;font-size:46px;font-weight:800;box-shadow:0 0 70px #f9731688}
#boot h1{font-size:44px;margin-top:22px;letter-spacing:1px}#boot p{color:#94a3b8;margin-top:8px;letter-spacing:3px;font-size:13px}
header{display:flex;justify-content:space-between;align-items:center;padding:22px 44px 6px}
.brand{display:flex;align-items:center;gap:14px}.brand .mark{width:48px;height:48px;border-radius:15px;font-size:24px;box-shadow:0 6px 24px #f9731666}
.brand b{font-size:24px;letter-spacing:.3px;display:block}.brand small{color:#94a3b8;font-size:12px;letter-spacing:2px}
.time{text-align:right}#clock{font-size:34px;font-weight:300;letter-spacing:1px}#date{color:#94a3b8;font-size:13px;margin-top:2px}
#tick{margin:8px 44px 0;padding:9px 18px;border-radius:99px;background:#ffffff12;border:1px solid #ffffff1f;color:#fde68a;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;backdrop-filter:blur(10px)}
main{height:calc(100vh - 150px);overflow:hidden;padding:0 36px}
h2{font-size:13px;letter-spacing:3px;text-transform:uppercase;color:#cbd5e1;margin:14px 10px 0;display:flex;align-items:center;gap:10px}
h2:before{content:"";width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,#f97316,#ec4899)}
.row{display:flex;gap:18px;padding:14px 10px;overflow:hidden}
.f{flex:none;border-radius:22px;transition:transform .18s,box-shadow .18s;cursor:pointer}
.on{transform:scale(1.08) translateY(-3px);box-shadow:0 0 0 3px #fff,0 18px 40px #f9731699;z-index:2;position:relative}
.hi{display:flex;align-items:center;justify-content:space-between;padding:6px 10px 0}.hi div{font-size:30px;font-weight:700}.hi span{color:#94a3b8;font-size:15px;display:block;font-weight:400;margin-top:4px}
.pill{padding:14px 26px;border-radius:99px;background:#ffffff18;border:1px solid #ffffff2e;font-weight:600;font-size:15px;backdrop-filter:blur(12px)}
.app{width:170px;height:112px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:15px;border:1px solid #ffffff30;box-shadow:inset 0 1px 0 #ffffff40}
.app i{font-style:normal;font-size:34px;filter:drop-shadow(0 3px 6px #0006)}
.nw{width:310px;height:146px;padding:16px 18px;font-size:15px;line-height:1.4;background:#ffffff10;border:1px solid #ffffff1c;backdrop-filter:blur(14px);overflow:hidden}
.nw b{display:inline-block;font-size:10px;letter-spacing:2px;padding:3px 10px;border-radius:99px;margin-bottom:9px;color:#05070d}
.nw i{display:block;font-size:11px;color:#94a3b8;margin-top:8px;font-style:normal}
.mv{width:150px;height:226px;background:#111827 center/cover;position:relative;overflow:hidden;border:1px solid #ffffff22}
.mv span{position:absolute;bottom:0;left:0;right:0;padding:30px 12px 12px;font-size:12px;font-weight:600;background:linear-gradient(transparent,#000d)}
.mv em{position:absolute;top:10px;right:10px;font-style:normal;font-size:11px;font-weight:700;padding:4px 9px;border-radius:99px;background:#000a;color:#fbbf24;backdrop-filter:blur(6px)}
#set{position:fixed;inset:0;background:#070a14ee;backdrop-filter:blur(24px);z-index:8;display:none;padding:56px}#set.show{display:block}
#set h3{font-size:32px;margin-bottom:6px}#set p{color:#94a3b8;margin-bottom:18px}
.sb{width:240px;height:92px;background:#ffffff12;border:1px solid #ffffff22;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:16px;text-align:center;padding:10px}
#st{position:fixed;left:18px;bottom:8px;font-size:11px;color:#64748b;z-index:6}
#toast{position:fixed;top:24px;left:50%;transform:translateX(-50%);background:#0f172af0;border:1px solid #f97316;padding:12px 22px;border-radius:99px;z-index:7;display:none;font-size:14px}

body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.mark{position:relative;overflow:hidden;animation:spin 7s ease-in-out infinite;box-shadow:0 0 0 2px #ffffff40 inset,0 22px 60px #f9731699,0 8px 0 #7c2d12}
.mark:before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,#ffffff88 50%,transparent 60%) 150% 0/250% 100% no-repeat;animation:sw 3.6s ease-in-out infinite;z-index:2}
.mark:after{content:"";position:absolute;left:0;right:0;top:0;height:46%;background:linear-gradient(#ffffff55,transparent);border-radius:inherit}
.t3{position:relative;z-index:1;color:#fff;text-shadow:1px 1px 0 #fde7c8,2px 2px 0 #f9c58c,3px 3px 0 #ef9650,4px 4px 0 #d2672a,5px 5px 0 #a8481c,6px 6px 0 #7c2d12,8px 10px 18px #000a}
.li{width:86%;height:86%;object-fit:contain;position:relative;z-index:1;filter:drop-shadow(0 8px 12px #000a)}.li+.t3{display:none}
.mark:has(.li){background:none;box-shadow:none}.mark:has(.li):before,.mark:has(.li):after{display:none}
@keyframes spin{0%,100%{transform:perspective(500px) rotateY(-20deg) rotateX(8deg)}50%{transform:perspective(500px) rotateY(20deg) rotateX(-6deg) translateY(-4px)}}
@keyframes sw{to{background-position:-50% 0}}@keyframes gl{to{background-position:200% 0}}
#boot .mark{width:140px;height:140px;font-size:84px;border-radius:42px}
#boot h1{background:linear-gradient(90deg,#fff,#fde68a,#fb923c,#ec4899,#fff);background-size:200%;-webkit-background-clip:text;color:transparent;animation:gl 4s linear infinite}
.brand b{background:linear-gradient(90deg,#fff,#fde68a,#fb923c,#fff);background-size:200%;-webkit-background-clip:text;color:transparent;animation:gl 6s linear infinite}
.on{transform:perspective(700px) scale(1.09) translateY(-5px) rotateX(3deg)!important}
.on:after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(115deg,transparent 40%,#ffffff55 50%,transparent 60%) 150% 0/250% 100% no-repeat;animation:sw 1.3s ease-out;pointer-events:none}
.app{box-shadow:inset 0 2px 0 #ffffff66,inset 0 -14px 24px #0005,0 14px 30px #000a!important}
.nw,.pill,.sb,.mv{box-shadow:inset 0 1px 0 #ffffff40,0 12px 30px #0007}
.app i{font-size:38px;transform:translateZ(30px);filter:drop-shadow(0 6px 8px #0008)}
#tick{box-shadow:0 6px 24px #0006,inset 0 1px 0 #ffffff30}
.hl{height:64px;width:auto;filter:drop-shadow(0 4px 14px #7c3aedaa);animation:fl2 5s ease-in-out infinite alternate}
@keyframes fl2{to{transform:translateY(-4px) rotate(-2deg)}}
#boot .bb{position:absolute;inset:0;background:url(splash.jpg) center/cover;filter:blur(36px) brightness(.55);transform:scale(1.15)}
#boot .bi{position:relative;height:100vh;max-width:100%;object-fit:contain;animation:zin 2.6s ease-out}
#boot .fb{position:relative}
@keyframes zin{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
</style></head><body>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
<div id="boot"><div class="bb"></div><img class="bi" src="splash.jpg" onerror="this.remove();document.querySelector('#boot .fb').style.display='flex'"><div class="fb" style="display:none;flex-direction:column;align-items:center"><div class="mark"><span class="t3">T</span></div><h1>Tadavi’s TV</h1><p>MADE BY PURVESH</p></div></div>
<header><div class="brand"><img class="hl" src="logo.png" onerror="this.outerHTML='<div class=mark><span class=t3>T</span></div>'"><div><b>Tadavi’s TV</b><small>MADE BY PURVESH</small></div></div><div class="time"><div id="clock"></div><div id="date"></div></div></header>
<div id="st"></div><div id="tick">Loading latest news…</div><div id="toast"></div>
<main><div class="row hi" id="r0"><div id="hello"></div><div class="f pill" data-s="all">⚙️  Settings</div></div>
<h2>Apps</h2><div class="row" id="apps"></div>
<h2>Live News · India · Maharashtra · Pune · Jalgaon</h2><div class="row" id="news"><div class="f nw">Loading…</div></div>
<h2>Trending Movies Today</h2><div class="row" id="mt"><div class="f nw">Loading…</div></div>
<h2>New Hindi Movies</h2><div class="row" id="mh"><div class="f nw">Loading…</div></div></main>
<div id="set"><h3>System Settings</h3><p>Opens your TV’s real settings. Press Back to return.</p><div class="row" style="flex-wrap:wrap" id="sg"></div></div>
<script>
const A=[["YouTube","youtube","#dc2626,#7f1d1d","▶️"],["Prime Video","prime","#0ea5e9,#1e3a8a","🎬"],["JioHotstar","hotstar","#8b5cf6,#4c1d95","✨"],["Netflix","netflix","#ef4444,#450a0a","🎞️"],["Sony LIV","sonyliv","#7c3aed,#1e1b4b","📺"],["Spotify","spotify","#22c55e,#14532d","🎧"],["Xiaomi TV+","xiaomitv","#fb923c,#9a3412","📡"],["Play Store","playstore","#14b8a6,#134e4a","🛍️"]];
const S=[["🖼️ Picture","picture"],["🔊 Sound","sound"],["📶 Wi-Fi","wifi"],["🔌 Ethernet / Network","network"],["🔵 Bluetooth","bluetooth"],["📦 Apps","apps"],["🛠️ Enable Developer Mode","about"],["👨‍💻 Developer Options","developer"],["⚙️ All Settings","all"]];
const RC={INDIA:"#34d399",MAHARASHTRA:"#fb923c",PUNE:"#38bdf8",JALGAON:"#fbbf24"};
const $=s=>document.querySelector(s),B=window.Android;let rows=[],r=1,c=0,topNews="";
$("#apps").innerHTML=A.map(a=>`<div class="f app" style="background:linear-gradient(145deg,${a[2]})" data-k="${a[1]}"><i>${a[3]}</i>${a[0]}</div>`).join("");
$("#sg").innerHTML=S.map(s=>`<div class="f sb" data-s="${s[1]}">${s[0]}</div>`).join("");
function col(){const q=$("#set").classList.contains("show")?"#set .row":"main .row";rows=[...document.querySelectorAll(q)].map(x=>[...x.querySelectorAll(".f")]).filter(x=>x.length)}
function foc(){document.querySelectorAll(".on").forEach(e=>e.classList.remove("on"));r=Math.min(r,rows.length-1);c=Math.min(c,rows[r].length-1);const e=rows[r][c];e.classList.add("on");e.scrollIntoView({block:"center",inline:"center",behavior:"smooth"})}
function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",4500)}
let lastAct=0;const WEB={youtube:"https://www.youtube.com",prime:"https://www.primevideo.com",hotstar:"https://www.hotstar.com",netflix:"https://www.netflix.com",sonyliv:"https://www.sonyliv.com",spotify:"https://open.spotify.com",playstore:"https://play.google.com"};
function act(e){if(Date.now()-lastAct<500)return;lastAct=Date.now();const k=e.dataset.k;
if(k){if(B&&typeof B.launch==="function")B.launch(k);else if(WEB[k])window.open(WEB[k],"_blank");else toast("Open this app on your TV")}
else if(e.dataset.s){if($("#set").classList.contains("show")){if(B&&typeof B.openSettings==="function")B.openSettings(e.dataset.s);else toast("Settings open only inside the TV app")}else{$("#set").classList.add("show");r=0;c=0;col();foc()}}}
document.addEventListener("keydown",e=>{const k=e.key,n=e.keyCode;
if(k==="ArrowUp"){r=Math.max(0,r-1)}else if(k==="ArrowDown"){r=Math.min(rows.length-1,r+1)}else if(k==="ArrowLeft"){c=Math.max(0,c-1)}else if(k==="ArrowRight"){c=Math.min(rows[r].length-1,c+1)}
else if(k==="Enter"||n===23){act(rows[r][c]);return}else if(k==="Escape"||k==="Backspace"){if($("#set").classList.contains("show")){$("#set").classList.remove("show");r=1;c=0;col();foc()}return}else return;
e.preventDefault();foc()});
document.addEventListener("click",e=>{const f=e.target.closest(".f");if(f)act(f)});
function clock(){const d=new Date(),h=d.getHours();$("#clock").textContent=d.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
$("#date").textContent=d.toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long"});
$("#hello").innerHTML=`${h<12?"Good morning":h<17?"Good afternoon":"Good evening"}, Purvesh<span>What do you want to watch today?</span>`}
setInterval(clock,1000);clock();
function ago(d){const m=Math.round((Date.now()-new Date(d))/6e4);return isNaN(m)?"":m<60?m+" min ago":Math.round(m/60)+" h ago"}
window.onNews=s=>{let l;try{l=JSON.parse(s)}catch(e){l={error:"bad data"}}
if(!Array.isArray(l)||!l.length){ST.n="News failed: "+(l.error||"empty");stat();return}
const t=cl(l[0]);if(topNews&&t!==topNews)toast("🔔 New top story: "+t);topNews=t;$("#tick").textContent="🔴 TOP STORY: "+t;ST.n="News updated "+new Date().toLocaleTimeString("en-IN");stat();
$("#news").innerHTML=l.map(n=>`<div class="f nw"><b style="background:${RC[n.region]||"#fff"}">${n.region}</b><div>${cl(n)}</div><i>${n.src} · ${ago(n.date)}</i></div>`).join("");col();foc()};
function cl(n){return n.src&&n.title.endsWith(" - "+n.src)?n.title.slice(0,-(n.src.length+3)):n.title}
const ST={b:window.Android?"Android bridge: connected":"Browser mode (no TV bridge)",n:"News: loading",m:"Movies: loading"};
function stat(){$("#st").textContent=ST.b+" · "+ST.n+" · "+ST.m}
const IM="https://image.tmdb.org/t/p/w342";
function mv(l){return l.filter(m=>m.poster_path).slice(0,15).map(m=>`<div class="f mv" style="background-image:url(${IM}${m.poster_path})"><em>★ ${(m.vote_average||0).toFixed(1)}</em><span>${m.title}</span></div>`).join("")}
function show(o){if(o.nokey||o.error){ST.m=o.nokey?"Movies: add TMDB key":"Movies failed: "+o.error;$("#mt").innerHTML=$("#mh").innerHTML=`<div class="f nw">${o.nokey?"Add your TMDB key in MainActivity.kt":"Could not load movies: "+o.error}</div>`}else{ST.m="Movies updated";$("#mt").innerHTML=mv(o.trending);$("#mh").innerHTML=mv(o.hindi)}stat();col();foc()}
window.onMovies=s=>{const o=JSON.parse(s);if(!o.nokey&&!o.error){try{localStorage.setItem("mv",s);localStorage.setItem("mvd",new Date().toDateString())}catch(e){}}show(o)};
function movies(){let d=null;try{d=localStorage.getItem("mvd");const c=localStorage.getItem("mv");if(c)show(JSON.parse(c))}catch(e){}if(d!==new Date().toDateString()){if(B&&typeof B.fetchMovies==="function")B.fetchMovies();else webMovies()}}
function news(){if(B&&typeof B.fetchNews==="function")B.fetchNews();else webNews()}
const TMDB_JS_KEY="";
const FD=[["INDIA","https://news.google.com/rss?hl=en-IN&gl=IN&ceid=IN:en"],["MAHARASHTRA","https://news.google.com/rss/search?q=Maharashtra&hl=en-IN&gl=IN&ceid=IN:en"],["PUNE","https://news.google.com/rss/search?q=Pune&hl=en-IN&gl=IN&ceid=IN:en"],["JALGAON","https://news.google.com/rss/search?q=Jalgaon&hl=en-IN&gl=IN&ceid=IN:en"]];
async function webNews(){const out=[];for(const [rg,u] of FD){try{const j=await(await fetch("https://api.rss2json.com/v1/api.json?rss_url="+encodeURIComponent(u))).json();(j.items||[]).slice(0,6).forEach(i=>{const p=i.title.lastIndexOf(" - ");out.push({region:rg,title:p>0?i.title.slice(0,p):i.title,src:p>0?i.title.slice(p+3):"Google News",date:(i.pubDate||"").replace(" ","T")+"Z"})})}catch(e){}}window.onNews(JSON.stringify(out.length?out:{error:"no internet or feed blocked"}))}
async function webMovies(){if(!TMDB_JS_KEY){window.onMovies(JSON.stringify({nokey:true}));return}try{const b="https://api.themoviedb.org/3",k=TMDB_JS_KEY;const t=await(await fetch(`${b}/trending/movie/day?api_key=${k}&language=en-IN`)).json();const h=await(await fetch(`${b}/discover/movie?api_key=${k}&with_original_language=hi&region=IN&sort_by=popularity.desc&primary_release_date.gte=2025-01-01`)).json();window.onMovies(JSON.stringify({trending:t.results||[],hindi:h.results||[]}))}catch(e){window.onMovies(JSON.stringify({error:String(e)}))}}
stat();col();foc();news();movies();setInterval(news,60000);setInterval(movies,3600000);
setTimeout(()=>{$("#boot").style.opacity=0;setTimeout(()=>$("#boot").remove(),700)},3200);
</script></body></html>
